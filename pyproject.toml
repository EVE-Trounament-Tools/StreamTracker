[project]
name = "stream-tracker"
version = "0.1.0"
description = "Live OCR tracker for EVE Alliance Tournament streams"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pytesseract",
    "rapidfuzz",
    "streamlink",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stream-tracker = "stream_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
